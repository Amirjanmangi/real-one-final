<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var currentFetch = rawFetch ? function() {
            return rawFetch.apply(window, arguments);
          } : undefined;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
